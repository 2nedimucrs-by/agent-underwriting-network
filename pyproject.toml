[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-underwriting-network"
version = "0.1.0"
description = "Evidence-linked, task-specific underwriting infrastructure for AI agents."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
aun-discover = "aun.discovery:main"

[tool.setuptools.packages.find]
where = ["src"]
