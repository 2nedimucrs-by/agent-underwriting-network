name: Claim Verification Checks

on:
  push:
    branches:
      - main
      - codex/claim-terminal-state-guard
    paths:
      - .github/workflows/claim-verification.yml
      - infra/supabase/functions/verify-github-claim/**
      - tests/claim_policy.test.mjs
  pull_request:
    paths:
      - .github/workflows/claim-verification.yml
      - infra/supabase/functions/verify-github-claim/**
      - tests/claim_policy.test.mjs

permissions:
  contents: read

jobs:
  claim-policy-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.7.14
      - name: Test claim verification policy
        run: node --test tests/claim_policy.test.mjs
      - name: Type-check claim verification Edge Function
        run: deno check --no-config infra/supabase/functions/verify-github-claim/index.ts
