name: CI

on:
  push:
    branches: [main, codex/claim-terminal-state-guard]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.7.14
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Test claim verification policy
        run: node --test tests/claim_policy.test.mjs
      - name: Type-check claim verification Edge Function
        run: deno check --no-config infra/supabase/functions/verify-github-claim/index.ts
      - name: Check browser JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/account.js
          node --check site/admin.js
          node --check site/compare.js
          node --check site/analytics.js
          node --check site/underwrite.js
      - name: Smoke-test maintainer evidence action collector
        run: |
          python scripts/maintainer_evidence.py
          python -c "import json; p=json.load(open('.aun/evidence-submission.json')); assert p['status']=='SELF_COLLECTED_NOT_VERIFIED'"
      - run: python scripts/validate_static_site.py
      - run: python scripts/check_no_secrets.py
